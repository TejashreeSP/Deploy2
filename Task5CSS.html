<!DOCTYPE html>
<html>
<head>
  <title>Task 5</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
    }

    .main-content {
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      color: royalblue;
      font-size: 36px;
      margin-bottom: 20px;
    }

    .login-container {
      max-width: 400px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background-color: #fff;
    }

    .avatar {
      display: block;
      margin: 0 auto 20px auto;
      width: 100px;
      height: 100px;
      border-radius: 50%;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .login-btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .cancel-btn {
      background-color: #f44336;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .login-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #eee;
      padding: 10px;
      margin-top: 20px;
      font-size: 14px;
      border-radius: 4px;
    }

    a {
      color: #333;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="main-content">
    <h2>Task 5</h2>
    <div class="login-container">
      <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="avatar" class="avatar">
      <form>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter Username">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password">

        <button type="submit" class="login-btn">Login</button>

        <div class="remember-forgot">
          <label><input type="checkbox"> Remember me</label>
        </div>

        <div class="login-footer">
          <button type="button" class="cancel-btn">Cancel</button>
          <a href="#">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
