<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <style>
    table {
      width: 50%;
      border-collapse: collapse;
      margin: 50px auto;
      font-family: Arial, sans-serif;
    }
    h3 {
      text-align: center;
    }
    .submit-button {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2 style="color: cornflowerblue;">Task 3</h2>
  <h3 style="color: blue;">Registration form</h3>

  <form>
    <table border="1" cellpadding="5">
      <tr>
        <td>First Name</td>
        <td><input type="text" name="firstname"></td>
      </tr>
      <tr>
        <td>Last Name</td>
        <td><input type="text" name="lastname"></td>
      </tr>
      <tr>
        <td>Email</td>
        <td><input type="email" name="email"></td>
      </tr>
      <tr>
        <td>Password</td>
        <td><input type="password" name="password"></td>
      </tr>
      <tr>
        <td>Re-enter Password</td>
        <td><input type="password" name="repassword"></td>
      </tr>
      <tr>
        <td>Gender</td>
        <td>
          <label><input type="radio" name="gender" value="male"> Male</label><br>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </td>
      </tr>
      <tr>
        <td>Age</td>
        <td><input type="number" name="age"></td>
      </tr>
      <tr>
        <td>Phone Number</td>
        <td><input type="tel" name="phone"></td>
      </tr>
      <tr>
        <td>Address</td>
        <td><textarea name="address" rows="3" cols="30"></textarea></td>
      </tr>
      <tr>
        <td>State</td>
        <td><input type="text" name="state"></td>
      </tr>
      <tr>
        <td>Country</td>
        <td>
          <select name="country">
            <option>Choose your country</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Other</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Languages known</td>
        <td>
          <input type="checkbox" name="language" value="English"> English
          <input type="checkbox" name="language" value="Kannada"> Kannada
          <input type="checkbox" name="language" value="Hindi"> Hindi
          <input type="checkbox" name="language" value="Telugu"> Telugu
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="checkbox" name="declaration"> Hereby I declare all the given details are true
        </td>
      </tr>
      <tr>
        <td colspan="2" style="text-align: right;">
          <a href="https://www.acharya.ac.in" target="_blank" style="color: black; text-decoration: none;">
            Log in to <span style="color: purple;">Acharya</span> website
          </a>
        </td>
      </tr>
      </table>
    <div class="submit-button">
      <input type="submit" value="Register">
    </div>
  </form>

</body>
</html>
