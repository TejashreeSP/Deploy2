<!DOCTYPE html>
<html>
<head>
  <title>Task 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
    }

    h1 {
      text-align: left;
      color: #2b4fa2;
    }

    .list-box {
      border: 1px solid black;
      width: 300px;
      padding: 10px;
      margin: 30px auto;
    }

    .link-box {
      border: 1px solid gray;
      background-color: #f0f0f0;
      padding: 10px;
      width: 600px;
      margin: auto;
      font-size: 14px;
    }

    .link-box a {
      margin: 0 5px;
      text-decoration: underline;
      color: blue;
    }

    .link-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Task 2</h1>

  <div class="list-box">
    <p>Lists can be nested (list inside list):</p>
    <ul>
      <li>Coffee</li>
      <li>Tea
        <ul type="circle">
          <li>Black tea</li>
          <li>Green tea</li>
        </ul>
      </li>
      <li>Milk</li>
    </ul>
  </div>

  <div class="link-box">
    <p>Click any of the following links</p>
    <a href="#" target="_blank">Opens in New</a> |
    <a href="#" target="_self">Opens in Self</a> |
    <a href="#" target="_parent">Opens in Parent</a> |
    <a href="#" target="_top">Opens in Body</a>
  </div>

</body>
</html>
